# Builds the Android app (android/) and publishes it as daima-health.apk on a GitHub release.
# The download link https://github.com/<repo>/releases/latest/download/daima-health.apk always
# points at the newest build.
#
# Needs the repository variable APP_URL (the live https:// website address).
# Optional secrets for a permanent signing key (lets new versions install over old ones, and
# hides the address bar once ANDROID_CERT_SHA256 is set on the website):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check APP_URL
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the APP_URL repository variable (Settings > Secrets and variables > Actions > Variables) to the live https:// address of the website."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a temporary key. Users must uninstall the old app before installing this one."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon -PappUrl="$APP_URL" -PversionCode=${{ github.run_number }}

      - name: Show signing certificate
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk daima-health.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs daima-health.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: DAIMA Health for Android 1.0.${{ github.run_number }}
          files: daima-health.apk
          make_latest: "true"
          body: |
            Download **daima-health.apk** below and open it on your Android phone.
            If Android asks, allow your browser to install apps from this source.
